<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a12;
      --ink: #f7fbff;
      --muted: #afbac8;
      --cyan: #6ee7ff;
      --rose: #ff7aae;
      --gold: #ffd166;
      --glass: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(110, 231, 255, 0.26), transparent 28%),
        radial-gradient(circle at 78% 25%, rgba(255, 122, 174, 0.23), transparent 25%),
        radial-gradient(circle at 50% 88%, rgba(255, 209, 102, 0.19), transparent 30%),
        linear-gradient(135deg, #080a12 0%, #101827 55%, #0a0d18 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(circle, black, transparent 72%);
    }

    main {
      width: min(92vw, 860px);
      padding: clamp(32px, 7vw, 76px);
      position: relative;
      isolation: isolate;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(22px);
      text-align: center;
    }

    main::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(120deg, var(--cyan), transparent 32%, var(--rose) 68%, var(--gold));
      opacity: 0.55;
      filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 9rem);
      line-height: 0.9;
      letter-spacing: 0;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, var(--cyan), #ffffff 42%, var(--rose));
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 18px 48px rgba(110, 231, 255, 0.22);
    }

    p {
      max-width: 560px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      line-height: 1.7;
    }

    .sparkle-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
    }

    .sparkle {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 24px currentColor;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .sparkle:nth-child(2) {
      width: 15px;
      height: 15px;
      background: var(--rose);
      animation-delay: 0.22s;
    }

    .sparkle:nth-child(3) {
      background: var(--gold);
      animation-delay: 0.44s;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.62;
      }
      50% {
        transform: translateY(-8px) scale(1.25);
        opacity: 1;
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 32px 22px;
      }

      p {
        line-height: 1.55;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Hello world greeting">
    <p class="eyebrow">A tiny page with big energy</p>
    <h1>Hello <span>World</span></h1>
    <p>Welcome to your shiny new HTML file, dressed up with glass, glow, and a little motion.</p>
    <div class="sparkle-row" aria-hidden="true">
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
    </div>
  </main>
</body>
</html>
