<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #afbac8;
      --cyan: #6ee7ff;
      --rose: #ff7aae;
      --gold: #ffd166;
      --line: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 209, 102, 0.22), transparent 28%),
        radial-gradient(circle at 78% 24%, rgba(110, 231, 255, 0.24), transparent 25%),
        radial-gradient(circle at 48% 88%, rgba(255, 122, 174, 0.2), transparent 30%),
        linear-gradient(135deg, #080a12 0%, #101827 55%, #0a0d18 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(circle, black, transparent 72%);
    }

    nav {
      position: fixed;
      top: 22px;
      left: 50%;
      z-index: 2;
      display: flex;
      gap: 6px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(8, 10, 18, 0.58);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    nav a {
      min-width: 86px;
      padding: 10px 14px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    nav a:hover,
    nav a.active {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-1px);
    }

    main {
      width: min(92vw, 820px);
      padding: clamp(34px, 7vw, 72px);
      position: relative;
      isolation: isolate;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(22px);
    }

    main::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(120deg, var(--gold), transparent 30%, var(--cyan) 62%, var(--rose));
      opacity: 0.52;
      filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6.6rem);
      line-height: 0.96;
      letter-spacing: 0;
      text-wrap: balance;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(90deg, var(--gold), #ffffff 48%, var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
    }

    p {
      max-width: 620px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.1vw, 1.18rem);
      line-height: 1.72;
    }

    .contact-list {
      display: grid;
      gap: 12px;
      margin-top: 32px;
    }

    .contact-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 64px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      font-weight: 800;
      text-decoration: none;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .contact-list a:hover {
      border-color: rgba(110, 231, 255, 0.65);
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .contact-list span {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    @media (max-width: 620px) {
      body {
        padding: 92px 0 28px;
      }

      nav {
        top: 14px;
        width: min(92vw, 340px);
      }

      nav a {
        min-width: 0;
        flex: 1;
        padding-inline: 8px;
      }

      main {
        padding: 32px 22px;
      }

      .contact-list a {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Site navigation">
    <a href="hello-world.html">Home</a>
    <a href="about.html">About</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>

  <main>
    <p class="eyebrow">Say hello</p>
    <h1>Let's <span>connect.</span></h1>
    <p>Drop a note, send an idea, or just wave from across the internet. This contact page is ready for your real details whenever you want them.</p>
    <div class="contact-list" aria-label="Contact options">
      <a href="mailto:muzi.khawar@gmail.com">
        Email
        <span>hello@example.com</span>
      </a>
      <a href="tel:+92 313 3862835">
        Phone
        <span>+1 000 000 0000</span>
      </a>
      <a href="hello-world.html">
        Back Home
        <span>Return to the main page</span>
      </a>
    </div>
  </main>
</body>
</html>
